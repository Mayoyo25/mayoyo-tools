<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mayoyo Tools — small, client-side, no-backend web utilities.">
  <title>Mayoyo Tools</title>
  <link rel="stylesheet" href="shared/tailwind.build.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col px-4 py-16 sm:px-6">
    <header class="mb-10">
      <h1 class="text-2xl font-semibold tracking-tight">Mayoyo Tools</h1>
      <p class="mt-1 text-sm text-slate-400">Small, client-side, no-backend utilities.</p>
    </header>

    <section class="grid gap-4 sm:grid-cols-2">
      <a href="json-validator/index.html" class="group rounded-2xl border border-slate-800 bg-slate-900/60 p-5 transition hover:border-slate-600 hover:bg-slate-900">
        <div class="grid h-10 w-10 place-items-center rounded-xl bg-emerald-500/10 text-emerald-400 ring-1 ring-emerald-500/20">
          <span class="font-mono text-lg">{ }</span>
        </div>
        <h2 class="mt-3 text-sm font-semibold group-hover:text-emerald-300">JSON Validator</h2>
        <p class="mt-1 text-xs text-slate-500">Validate, format and inspect JSON locally.</p>
      </a>

      <!--
        Add a new tool here, e.g.:
        <a href="pdf-merger/" class="group rounded-2xl border border-slate-800 bg-slate-900/60 p-5 transition hover:border-slate-600 hover:bg-slate-900">
          <h2 class="mt-3 text-sm font-semibold group-hover:text-emerald-300">PDF Merger</h2>
          <p class="mt-1 text-xs text-slate-500">Merge PDFs locally, no upload.</p>
        </a>
      -->
    </section>

    <footer class="mt-16 text-center text-[11px] text-slate-600">
      No backend &bull; No database &bull; No analytics
    </footer>
  </main>
</body>
</html>
